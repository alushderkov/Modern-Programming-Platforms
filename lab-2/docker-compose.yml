name: lab-2

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 30s
      retries: 12
      start_period: 15s

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/kadr
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: kadr-lab-dev-secret-change-me
      JWT_ACCESS_TTL_SEC: "900"
      JWT_REFRESH_TTL_SEC: "604800"
      MAX_LOGIN_ATTEMPTS: "5"
      LOCKOUT_MINUTES: "15"
      MAX_SESSIONS: "5"
      APP_URL: http://localhost:8080
      LOG_LEVEL: info
    volumes:
      - api_uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
  api_uploads:
