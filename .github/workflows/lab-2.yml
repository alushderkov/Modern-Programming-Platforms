name: lab-2

on:
  push:
    paths:
      - 'lab-2/**'
      - '.github/workflows/lab-2.yml'
  pull_request:
    paths:
      - 'lab-2/**'
      - '.github/workflows/lab-2.yml'

jobs:
  api:
    name: API typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-2/server
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab-2/server/package-lock.json
      - run: npm ci
      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 40); do
            if node -e "require('net').connect(27017,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          echo 'MongoDB did not become ready' && exit 1
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/kadr_ci
          JWT_SECRET: ci-secret
          NODE_ENV: test
          LOG_LEVEL: silent

  web:
    name: Client typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-2/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab-2/client/package-lock.json
      - run: npm ci
      - run: npm run build
